[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot-api"
version = "0.1.0"
description = "StudyPilot API"
requires-python = ">=3.11"
# 依赖按“首次需要它的开发周”分组。第 1 周真正需要的只有第一组；
# 提前留着后面的依赖不影响功能，但安装遇到问题时可以先只装第一组。
dependencies = [
  # --- 第 1 周：身份、学习空间与工程基础 ---
  "fastapi>=0.141,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.15,<3.0",
  "sqlalchemy[asyncio]>=2.1,<3.0",
  "asyncpg>=0.31,<1.0",
  "alembic>=1.20,<2.0",
  # 密码哈希直接使用 argon2-cffi：passlib 已停止维护，且与 bcrypt>=4.1 不兼容。
  "argon2-cffi>=25.1,<26.0",
  # Pydantic 的 EmailStr 需要它，缺失时会在导入 schema 时直接报错。
  "email-validator>=2.3,<3.0",

  # --- 第 2 周：文档上传、解析与异步入库 ---
  "python-multipart>=0.0.32,<1.0",
  "pypdf>=6.19,<7.0",
  "python-docx>=1.2,<2.0",
  "markdown-it-py>=4.2,<5.0",
  "redis>=8.1,<9.0",
  "celery>=5.6,<6.0",

  # --- 第 3 周：检索与生成 ---
  "pgvector>=0.5,<1.0",
  "openai>=3.19,<4.0",
  "sse-starlette>=3.4,<4.0",
  "tiktoken>=0.14,<1.0",
]

[project.optional-dependencies]
# 生产环境不需要。安装：pip install -e ".[dev]"
dev = [
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  # FastAPI 的 TestClient 基于 httpx；后续调用模型接口也复用它。
  "httpx>=0.28,<1.0",
  "ruff>=0.16,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = []
# 迁移脚本目录不参与 lint。它们由 alembic/script.py.mako 生成，是产物而非手写代码，
# 而模板输出天生带两个 lint 问题：空迁移里 sqlalchemy / alembic.op 的 import 用不到
# （F401），以及空的 upgrade()/downgrade() 里那个 pass（PIE790）。
# 空迁移在开发中会反复出现（每次 autogenerate 检查 schema 漂移都会产生一个），
# 靠改模板修不掉——除非在 Mako 里加条件分支，为了生成产物不值得。
# alembic/env.py 是手写的，仍然照常检查。
extend-exclude = ["alembic/versions"]

# 上面 [tool.ruff] 里的 src = [] 和这里的 known-first-party 要一起写，少一个都不起作用。
#
# backend/ 下有个 alembic/ 目录（迁移脚本），ruff 默认会从 src（默认 "."）自动
# 探测第一方模块，于是把这个目录和 site-packages 里的 alembic 包混为一谈，
# 把 app.* 的 import 排到 alembic 后面。src = [] 关掉自动探测，
# known-first-party 再显式指定真正的第一方包。
#
# 实际运行不受影响：那个目录没有 __init__.py，只是命名空间包的一段，
# site-packages 里的常规包优先级更高，import alembic 拿到的仍是真的 alembic
# （已验证）。只有 lint 结果会一直错下去。
[tool.ruff.lint.isort]
known-first-party = ["app"]
